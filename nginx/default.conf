# nginx site configuration for the home server image.
# Serves the static build on port 8080 (no TLS; Tailscale Serve or
# Cloudflare Tunnel terminate TLS in front of Caddy).
# - /healthz returns 200 for health checks and monitoring.
# - Unknown paths fall back to index.html so client-side routes work.
# - Missing files under /assets/ return 404 instead of index.html.
# - index.html, sw.js and the manifest are never cached, so updates reach
#   users; hashed assets are cached for a year.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CI: runs on every pull request and on pushes to main.
# Job "checks" runs lint, type checking, formatting, unit tests and the build.
# Job "e2e" runs Playwright end-to-end tests on Linux for both base paths:
#   "/" (home server image) and "/map-boundary-overlay/" (GitHub Pages).
# E2e cannot run locally on macOS 13, see docs/adr/004-e2e-in-ci-only.md.
# Least privilege: read-only access to the repository, no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2e with base path /
        run: npm run e2e
        env:
          BASE_PATH: /
      - name: E2e with base path /map-boundary-overlay/
        run: npm run e2e
        env:
          BASE_PATH: /map-boundary-overlay/
